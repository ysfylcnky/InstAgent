<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mumio — Veri Silme Durumu</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">
    <style>
        :root{
            --bg:#0b1120; --card:#131c31; --border:#243049;
            --text:#e6ecf7; --muted:#8291ad; --accent:#7C4DFF; --green:#22C55E;
            --brand-gradient:linear-gradient(135deg,#3B34B8,#6D4AFF,#5B45E0,#7C4DFF,#3E7BE0,#2A9BD4,#1EB8C8);
        }
        *{ box-sizing:border-box; margin:0; padding:0; }
        body{
            font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
            background:radial-gradient(1200px 600px at 50% -10%,#16233f 0%,var(--bg) 55%);
            color:var(--text); min-height:100vh; display:flex; align-items:center;
            justify-content:center; padding:20px;
        }
        .card{
            width:100%; max-width:460px; background:var(--card);
            border:1px solid var(--border); border-radius:16px; padding:38px 34px;
            box-shadow:0 24px 60px rgba(0,0,0,.45); text-align:center;
        }
        .icon{
            width:64px; height:64px; margin:0 auto 20px; border-radius:50%;
            background:rgba(34,197,94,.14); border:1px solid rgba(34,197,94,.4);
            color:var(--green); display:flex; align-items:center; justify-content:center;
            font-size:30px;
        }
        h1{ font-size:20px; margin-bottom:10px; }
        p{ color:#c8d2e6; font-size:14.5px; line-height:1.65; }
        .code{
            margin-top:22px; padding:12px 14px; background:#0d1526;
            border:1px solid var(--border); border-radius:10px;
            font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13.5px;
            color:var(--text); word-break:break-all;
        }
        .code span{ display:block; color:var(--muted); font-size:11px; margin-bottom:4px;
            font-family:-apple-system,sans-serif; text-transform:uppercase; letter-spacing:.08em; }
        a{ color:var(--accent); text-decoration:none; font-size:13px; }
        a:hover{ text-decoration:underline; }
        .foot{ margin-top:24px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✓</div>
        <h1>Veri silme talebi işlendi</h1>
        <p>
            Instagram kimliğinize ait mesaj, sipariş ve müşteri kayıtları sistemimizden
            kalıcı olarak silinmiştir. Silme talebiniz alındığı anda uygulanır.
        </p>
        {% if code %}
        <div class="code">
            <span>Onay kodu</span>{{ code }}
        </div>
        {% endif %}
        <div class="foot">
            <a href="/privacy">Gizlilik Politikası</a>
        </div>
    </div>
</body>
</html>
